<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- TITLE -->Deck</title>

  <!-- reveal.js core + theme (CDN). For offline use, repoint these three URLs
       at a local reveal.js dist/ copy. Swap the theme file to restyle. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css" id="theme">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/monokai.css">
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <!-- The agent replaces ONLY the block below with your-deck.md content.
           Keep the <section data-markdown> + <script type="text/template"> wrapper. -->
      <section data-markdown data-separator="^\r?\n---\r?\n" data-separator-vertical="^\r?\n--\r?\n" data-separator-notes="^Note:">
        <script type="text/template">
<!-- SLIDES -->
## Your Title
### One-line subtitle

Your name

---

## Slide two
- Point one
- Point two
        </script>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      transition: 'slide',
      plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
    });
  </script>
</body>
</html>
