## My Study Agent
### A personal AI that turns lecture notes into revision

Jordan Lee · AI Agent Workshop

Note: This is the demo deck built from the slides skill. Press S for speaker view.

---

## The Problem
- Students take notes but rarely revisit them
- Turning a week of notes into revision is slow and boring
- Generic AI tools don't know *your* course

---

## The Idea
- A bespoke agent that lives beside your notes
- Feed it a lecture → get a summary, flashcards, and a quiz
- **One-line pitch:** your notes, revised for you, automatically

---

## How It Works
1. Drop lecture notes into a folder
2. The agent applies your *study* skill (summary + Q&A)
3. Out come flashcards + a short practice quiz

---

## Why It's Different
- Tuned to your subject and your style, not generic
- Runs from a take-home starter kit you keep
- Works inside Claude Code / Codex — no new app to learn

---

## Thank You
Try it: open the kit → pick the `study` skill → point it at today's notes

Note: End on the call to action. Press Esc for the overview.
